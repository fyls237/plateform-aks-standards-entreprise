name: "Terraform CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  format:
    name: "Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.12.0"

      - name: Terraform Format
        run: terraform fmt -recursive -check -diff

  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/networking
          - modules/aks
          - modules/acr
          - modules/keyvault
          - modules/monitor
          - modules/identities
          - modules/log-analytics
          - modules/private-dns
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.12.0"

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  lint:
    name: "TFLint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint (modules)
        run: |
          for dir in modules/*/; do
            echo "==> Linting $dir"
            tflint --chdir="$dir" --format=compact || true
          done

  lock-consistency:
    name: "Provider Lock Consistency"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - environments/dev
          - environments/test
          - environments/preprod
          - environments/prod
          - examples/simple
          - examples/enterprise
          - examples/private-cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.12.0"

      - name: Verify .terraform.lock.hcl is committed
        working-directory: ${{ matrix.directory }}
        run: |
          if [ ! -f ".terraform.lock.hcl" ]; then
            echo "::error::.terraform.lock.hcl is missing in ${{ matrix.directory }}. Run 'make lock' and commit the result (see ADR-008)."
            exit 1
          fi

      - name: Init with locked providers (fails on drift/staleness)
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Check lock file covers all required platforms
        working-directory: ${{ matrix.directory }}
        run: |
          terraform providers lock \
            -platform=linux_amd64 \
            -platform=darwin_amd64 \
            -platform=darwin_arm64 \
            -platform=windows_amd64

          if [ -n "$(git status --porcelain .terraform.lock.hcl)" ]; then
            echo "::error::.terraform.lock.hcl in ${{ matrix.directory }} was missing platform hashes. Run 'make lock' locally and commit the changes."
            git diff .terraform.lock.hcl
            exit 1
          fi

  security:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.3125.0
        with:
          directory: modules/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true
          quiet: true

      - name: Upload SARIF results to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: results.sarif

      - name: Upload Checkov Report as Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: results.sarif
